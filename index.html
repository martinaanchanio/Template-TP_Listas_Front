<!DOCTYPE html>
<html lang="es">
<head>
    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="titulodeTODO">Comidas Argentinas</h1>
    <header>
      <input class="buscador" type="search" id="busqueda" placeholder="Busca una receta">
      <select class="filtros" id="filtrarCategoria">
        <option class="opciones" value="">Todas las categorías</option>

      </select>
      <select class="filtros" id="filtrarProvincia">
        <option class="opciones" value="">Todas las provincias</option>

      </select>
    </header>
    




    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>    




    <section class="addFood">
      <!-- Para el form para agregar comida -->
       <form id="agregarComidaForm">
        <h2 class="tituloForm">Agregar Comida</h2>
        <label for="nombre">Nombre de la comida</label>
        <input type="text" id="nombre" placeholder="Pon una comida" required>
        <label for="provincia">¿De qué provincia es?</label>
        <input type="text" id="provincia" placeholder="Pon su provincia de origen" required>
        <label for="categoria">¿Cuál es su categoría?</label>
        <input type="text" id="categoria" placeholder="Pon una categoría" required>
        <label for="ingredientes">¿Cuáles son sus ingredientes (separados por comas)?</label>
        <div class="contenedor-ingredientes">
          <input class="ingrediente" type="text" id="ingredientes" placeholder="Pon los ingredientes" required>
      
        </div>
        <button type="button" id="botonIngr">Agregar ingrediente</button>        
        <button type="submit">Agregar</button>
       </form>
    </section>




    <script type="module" src="./main.js"></script>
</body>
</html>
