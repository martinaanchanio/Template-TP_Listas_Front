<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
      <input type="search" id="busqueda" placeholder="Busca una receta">
      <select id="filtrarCategoria">
        <option value="">Todas las categorías</option>
        <option value="Parrilla">Parrilla</option>
        <option value="Horno">Horno</option>
        <option value="Frito">Frito</option>
        <option value="Guiso">Guiso</option>
      </select>
      <select id="filtrarProvincia">
        <option value="">Todas las provincias</option>
        <option value="Buenos Aires">Buenos Aires</option>
        <option value="Jujuy">Jujuy</option>
        <option value="Salta">Salta</option>
        <option value="Tucumán">Tucumán</option>
        <option value="Córdoba">Córdoba</option>
        <option value="Santa Fe">Santa Fe</option>
        <option value="Entre Rios">Entre Rios</option>
      </select>
    </header>
    




    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>    




    <section class="addFood">
      <!-- Para el form para agregar comida -->
       <form id="agregarComidaForm">
        <h2>Agregar Comida</h2>
        <label for="nombre">Nombre de la comida</label>
        <input type="text" id="nombre" placeholder="Pon una comida" required>
        <label for="provincia">¿De qué provincia es?</label>
        <input type="text" id="provincia" placeholder="Pon su provincia de origen" required>
        <label for="categoria">¿Cuál es su categoría?</label>
        <input type="text" id="categoria" placeholder="Pon una categoría" required>
        <label for="ingredientes">¿Cuáles son sus ingredientes (separados por comas)?</label>
        <input type="text" id="ingredientes" placeholder="Pon los ingredientes">
        <button type="submit">Agregar</button>
       </form>
    </section>




    <script type="module" src="./main.js"></script>
</body>
</html>
